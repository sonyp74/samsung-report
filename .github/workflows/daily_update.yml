name: Daily Samsung Report Update

on:
  schedule:
    # 매일 한국시간 오전 8:00 (UTC 시간 23:00) 실행
    - cron: '0 23 * * *'
  workflow_dispatch: # 수동 실행 버튼도 활성화

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
    - name: 저장소 체크아웃
      uses: actions/checkout@v3

    - name: 파이썬 환경 설정
      uses: actions/setup-python@v4
      with:
        python-version: '3.10'

    - name: 필요한 라이브러리 설치
      run: |
        python -m pip install --upgrade pip
        pip install beautifulsoup4

    - name: 크롤러 실행 및 index.html 생성
      run: python crawler.py

    - name: 변경사항 깃허브에 자동 커밋 및 푸시
      run: |
        git config --global user.name "github-actions[bot]"
        git config --global user.email "github-actions[bot]@users.noreply.github.com"
        git add index.html
        git diff --quiet && git diff --staged --quiet || (git commit -m "Auto update daily report" && git push)
